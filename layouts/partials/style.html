<style>
  :root {
    --width: 760px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --bg: #ffffff;
    --surface: #f6f8fa;
    --text: #2a3543;
    --heading: #101828;
    --muted: #5d6b7c;
    --border: #e4e9ef;
    --accent: #0076b4;
    --accent-2: #38b6ec;
    --accent-hover: #005c8f;
    --accent-soft: #eaf4fb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1420;
      --surface: #121d2c;
      --text: #d6dee8;
      --heading: #f4f7fb;
      --muted: #94a5b8;
      --border: #213148;
      --accent: #4fb3e8;
      --accent-2: #2b86b8;
      --accent-hover: #7ecdf2;
      --accent-soft: #14293d;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }

  body {
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    margin: 0 auto;
    padding: 0 20px 48px;
    max-width: var(--width);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    z-index: 100;
  }

  ::selection { background: var(--accent); color: #fff; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  h1, h2, h3, h4, h5, h6 {
    color: var(--heading);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 1.6em 0 0.55em;
    scroll-margin-top: 1.5rem;
  }
  h1 { font-size: 1.9em; margin-top: 0; }
  h2 { font-size: 1.45em; padding-bottom: 0.4em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.15em; margin-top: 1.4em; }
  h4 { font-size: 1em; }

  p { margin: 0 0 1.1em; }
  ul, ol { padding-left: 1.4em; margin: 0 0 1.1em; }
  li { margin: 0.25em 0; }

  strong, b { color: var(--heading); font-weight: 600; }

  time { font-family: var(--font-mono); font-size: 0.85em; color: var(--muted); }

  .post-author { white-space: nowrap; }
  .author-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    vertical-align: -4px;
    margin-right: 0.35em;
  }

  main { line-height: 1.7; }

  content { display: block; }

  img { max-width: 100%; height: auto; }

  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }

  blockquote {
    border-left: 3px solid var(--accent);
    background: var(--surface);
    margin: 1.4em 0;
    padding: 0.75em 1.25em;
    border-radius: 0 6px 6px 0;
    font-style: italic;
  }
  blockquote p:last-child { margin-bottom: 0; }

  code {
    font-family: var(--font-mono);
    font-size: 0.9em;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    color: var(--heading);
  }

  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1em 1.2em;
    overflow-x: auto;
  }
  pre code { background: none; border: 0; padding: 0; }

  .highlight, .code { border-radius: 8px; margin-block: 1.2em; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; margin: 1.2em 0; }
  th, td { border: 1px solid var(--border); padding: 0.55em 0.8em; text-align: left; }
  th { background: var(--surface); color: var(--heading); }

  button { margin: 0; cursor: pointer; font: inherit; }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 1.05rem 0 0.85rem;
    margin-bottom: 2.2rem;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem 1.5rem;
    flex-wrap: wrap;
  }
  .brand { display: inline-flex; align-items: center; line-height: 0; }
  .brand-logo { height: 32px; width: auto; display: block; }
  .brand-logo--dark { display: none; }

  @media (prefers-color-scheme: dark) {
    .brand-logo--light { display: none; }
    .brand-logo--dark { display: block; }
  }

  .site-nav { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 1.15rem; }
  .site-nav a {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.95em;
    padding: 0.25rem 0;
    position: relative;
  }
  .site-nav a:hover { color: var(--accent); text-decoration: none; }
  .site-nav a.is-active { color: var(--heading); }
  .site-nav a.is-active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Blog post list */
  ul.blog-posts { list-style: none; padding: 0; margin: 1.2em 0; }
  ul.blog-posts li {
    display: flex;
    gap: 0 0;
    padding: 0.65em 0;
    border-bottom: 1px solid var(--border);
  }
  ul.blog-posts li:last-child { border-bottom: 0; }
  ul.blog-posts li span { flex: 0 0 132px; color: var(--muted); }
  ul.blog-posts li a { color: var(--heading); font-weight: 600; }
  ul.blog-posts li a:hover { color: var(--accent); }
  ul.blog-posts li a:visited { color: var(--heading); }

  small a { margin-right: 0.75em; }

  .inline { width: auto !important; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    margin-top: 3em;
    padding-top: 1.5em;
    text-align: center;
    color: var(--muted);
    font-size: 0.92em;
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
  footer p { margin: 0.35em 0; }
  .footer-brand { color: var(--heading); font-weight: 700; }

  /* Small screens */
  @media (max-width: 560px) {
    .header-inner { justify-content: center; text-align: center; }
    .site-nav { justify-content: center; }
    ul.blog-posts li { flex-direction: column; }
    ul.blog-posts li span { flex: 0 0 auto; }
  }
</style>
