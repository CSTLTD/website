<div class="header-inner">
  <a href="{{ "" | relURL }}" class="brand" aria-label="CST — Computer Systems and Technologies, home">
    <img class="brand-logo brand-logo--light" src="{{ "images/cst-logo.png" | relURL }}" alt="CST logo" width="255" height="75">
    <img class="brand-logo brand-logo--dark" src="{{ "images/cst-logo-white.png" | relURL }}" alt="CST logo" width="255" height="75">
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    {{ $current := .RelPermalink }}
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if eq $current .URL }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</div>
