<header class="site-header">
  <div class="site-header-inner">
    <div class="site-brand">
      <a href="{{ .Site.BaseURL }}" class="brand-link" aria-label="CST Home">
        <img src="{{ .Site.BaseURL }}images/cst-logo.png" alt="CST Logo" class="brand-logo light-mode-logo">
        <img src="{{ .Site.BaseURL }}images/cst-logo-white.png" alt="CST Logo" class="brand-logo dark-mode-logo">
        <span class="brand-text">
          <span class="brand-title">CST</span>
          <span class="brand-subtitle">Computer Systems and Technologies</span>
        </span>
      </a>
    </div>

    <nav class="site-nav" id="site-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        {{ range .Site.Menus.main -}}
        <li class="nav-item">
          <a href="{{ .URL }}" class="nav-link{{ if eq $.RelPermalink .URL }} active{{ else if and (eq .URL "/") $.IsHome }} active{{ end }}" {{ if .Params.external }}target="_blank" rel="noopener" {{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{- end }}
      </ul>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" onclick="document.getElementById('site-nav').classList.toggle('nav-open'); this.classList.toggle('is-active');">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </div>
</header>
