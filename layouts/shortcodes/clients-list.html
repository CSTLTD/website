<ul>
  {{ range (where .Site.RegularPages "Section" "clients").ByWeight }}
  <li>
    {{ if .Params.client_url }}
    <a href="{{ .Params.client_url }}" target="_blank" rel="noopener noreferrer">{{ .Title }}</a>
    {{ else }}
    <a href="{{ .Permalink }}">{{ .Title }}</a>
    {{ end }}
  </li>
  {{ end }}
</ul>
