{{ define "main" -}}
<div class="services-grid">
  {{ range .Pages -}}
  <article class="service-card">

    <div class="service-image">
      {{ if .Params.image }}
      <img src="{{ .Params.image | absURL }}" alt="{{ .Title }}">
      {{ else if .Params.service_image }}
      <img src="{{ .Params.service_image | absURL }}" alt="{{ .Title }}">
      {{ else }}
      <div
        style="background: #eee; width: 100%; height: 100%; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #999;">
        No Image
      </div>
      {{ end }}
    </div>

    <div class="service-details">
      <h2>{{ .Title }}</h2>
      <p>
        {{ if .Description }}
        {{ .Description }}
        {{ else }}
        {{ .Summary | truncate 160 }}
        {{ end }}
      </p>
      <a href="{{ .Permalink }}" class="read-more-btn">Read More &rarr;</a>
    </div>

  </article>
  {{- end }}
</div>
{{- end }}
