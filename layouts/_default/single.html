{{ define "main" -}}
<article class="single-post-container">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if .Description }}
    <p class="post-lead">{{ .Description }}</p>
    {{ end }}
  </header>

  <div class="post-body prose">
    {{ .Content }}
  </div>
</article>
{{- end }}
