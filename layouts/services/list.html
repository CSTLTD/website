{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Description }}<p>{{ . }}</p>{{ end }}
<content>
  <ul>
        {{ range .Pages.ByWeight }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>{{ with .Description }} &mdash; {{ . | truncate 140 }}{{ end }}
    </li>
    {{ end }}
  </ul>
</content>
{{ end }}
