{{ define "main" }}
<article class="single-blog-post">

    <h1 class="post-page-title">{{ .Title }}</h1>

    {{ if .Params.image }}
    <div class="post-feature-banner">
        <img src="{{ .Params.image | absURL }}" alt="{{ .Title }} Banner">
    </div>
    {{ end }}

    <div class="post-body-markdown">
        {{ .Content }}
    </div>

</article>
{{ end }}
